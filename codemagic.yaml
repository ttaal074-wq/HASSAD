workflows:
  hassad-android:
    name: HASSAD Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Extract project and build APK
        script: |
          unzip -q HASSAD_Android_Full_Project.zip -d hassad_source
          cd hassad_source
          flutter pub get
          flutter build apk --release
    artifacts:
      - hassad_source/build/app/outputs/flutter-apk/app-release.apk
